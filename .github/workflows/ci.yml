name: ci

# Rust crate on the three platforms; cargo-deny, the TypeScript package, the
# test-vector check and the documentation check on Linux. Both implementations
# are libraries with no native build, so nothing here publishes anything.
#
# Actions are pinned by commit SHA with the readable version in the comment
# beside it: a major tag is a movable pointer. Dependabot updates SHA and
# comment together.
#
# `dtolnay/rust-toolchain` is pinned by SHA like the others, but that only
# fixes the action's code. The Rust version comes from the `toolchain:` input,
# set to the same value as `channel` in rust-toolchain.toml. Node comes from
# `ts/.nvmrc` and pnpm from `packageManager` in ts/package.json, so neither
# version is repeated here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The relay depends on the crate with `default-features = false`: the
      # envelope alone must compile.
      - name: Build without default features
        run: cargo build -p porecatu-protocol --no-default-features --locked

      # The crate is sans-IO: no async runtime may enter its normal dependency
      # graph. `cargo tree -i` fails when the package is absent, which is the
      # passing case, so the output goes into a variable instead of a pipe
      # (`| grep -q` under pipefail gives a false negative through SIGPIPE).
      - name: No tokio in the crate
        shell: bash
        run: |
          if out=$(cargo tree -p porecatu-protocol -e normal -i tokio --locked 2>&1); then
            echo "::error::tokio is in the dependency graph of porecatu-protocol:"
            echo "$out"
            exit 1
          fi
          echo "tokio not found, as expected"

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny

      - name: Licenses, sources and bans
        working-directory: rust
        run: cargo deny check

  ts:
    name: typescript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the version from `packageManager`; must run before setup-node
      # so that the pnpm store cache below can find the `pnpm` binary. The
      # package lives in `ts/`, so the path is given from the repository root.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ts/.nvmrc
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  vectors:
    name: test vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      # Checks the committed vectors against the CBOR codec and the CDDL
      # schema. The TypeScript side consumes the same files in `pnpm test`.
      - name: Check vectors
        working-directory: rust
        run: cargo run -p vectors --locked -- check

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Documentation links and schema
        run: python3 scripts/verify-docs.py

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history of the PR is needed to list its commits.
          fetch-depth: 0

      # Every commit of the PR must carry a `Signed-off-by:` trailer
      # (CONTRIBUTING.md). Merge commits are skipped: they are not authored
      # contributions. The SHAs come from the event, never from user text.
      - name: Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha has no Signed-off-by line (use git commit -s)."
              missing=1
            fi
          done
          exit "$missing"
