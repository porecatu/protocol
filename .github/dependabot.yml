version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Sensitive dependencies are pinned to an exact version, so a bump PR is the
  # prompt to read the changelog and rerun the vectors, not something to merge
  # blindly.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # BLAKE2s derives the host_id, so the protocol and the relay move to a
      # new blake2 minor together, by hand, with the vectors checked.
      - dependency-name: blake2
        versions: [">= 0.11"]

  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
