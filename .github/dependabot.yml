version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Sensitive dependencies are pinned to an exact version, so a bump PR is the
  # prompt to read the changelog and rerun the vectors, not something to merge
  # blindly.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
